<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAPEX Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: KPIs, plant basis, timeline, then objects (left) and plant view (right) */
  --bg:#edf0f3;--surface:#ffffff;--sunken:#f4f6f8;--ink:#16202a;--muted:#5a6775;--line:#d3dae1;
  --accent:#0a5c8f;--accent-soft:#dcebf5;--warn:#7a4700;--warn-soft:#fbefd9;--bad:#b3261e;--good:#1b6b3a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1480px;margin:0 auto;padding:22px 22px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
button{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.basis{display:flex;flex-wrap:wrap;gap:24px}
.basis>div{display:flex;flex-direction:column;gap:8px}
.ramp{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.ramp label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
input[type=number]{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:5px 6px;width:100%;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;font-size:13px}
.track{grid-column:1/3;display:block;height:6px;border-radius:3px;background:#e6ebf0;overflow:hidden}
.track span{display:block;height:6px;border-radius:3px;background:var(--accent)}
.btn{min-height:40px;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.years{display:flex;gap:4px;flex-wrap:wrap}
.yr{flex:1 1 104px;min-height:104px;cursor:pointer;padding:10px 24px 10px 26px;text-align:left;display:flex;flex-direction:column;gap:3px;border:0;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);background:#f4f6f8}
.yr:first-child{padding-left:14px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.yr .y{font-family:var(--display);font-weight:600;font-size:24px;line-height:1}
.yr .bar{display:block;height:6px;border-radius:3px;background:#d3dae1;overflow:hidden}
.yr .bar span{display:block;height:6px;border-radius:3px;background:var(--accent)}
.yr.per{background:#e2e8ee}.yr.past{background:#dcebf5}.yr.per.past{background:#c9def0}
.yr.on{background:var(--accent);color:#fff}.yr.on .bar{background:rgba(255,255,255,.3)}.yr.on .bar span{background:#fff}
.yr.short .p{color:var(--bad);font-weight:600}.yr.on.short .p{color:#ffd4d0}
.all{flex:0 1 110px;min-height:104px;border-radius:8px;cursor:pointer;font-weight:600;border:1px solid var(--accent);background:var(--surface);color:var(--accent)}
.all.on{background:var(--accent);color:#fff}
.main{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.left{flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:10px}
.right{flex:1.7 1 600px;min-width:0;display:flex;flex-direction:column;gap:12px}
.obj{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.objhead{display:flex;align-items:center;gap:10px;padding:10px 14px}
.objhead input{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.objtog{flex:1 1 auto;min-width:0;border:0;background:none;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;padding:4px 0;min-height:44px}
.objtog .chev{flex:none;width:12px;color:var(--muted);font-size:11px}
.objtog .nm{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.objtog .nm b{font-size:15px;line-height:1.25}
.objtog .rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{padding:1px 9px;border-radius:10px;font-size:12px;font-weight:500}
.p-done{background:var(--accent-soft);color:#06416a}.p-part{background:var(--warn-soft);color:var(--warn)}.p-none{background:#eef1f4;color:#4a5663}.p-off{background:#eef1f4;color:#4a5663;text-decoration:line-through}
.rows{border-top:1px solid var(--line);padding:6px 14px 12px;background:#fafbfc}
.row{display:grid;grid-template-columns:minmax(0,1fr) 72px 92px 86px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f4;font-size:13px}
.row .n{display:flex;align-items:center;gap:8px;min-width:0}
.dot{flex:none;width:8px;height:8px;border-radius:4px}
.d-done{background:var(--accent)}.d-part{background:#d98b1c}.d-none{box-shadow:inset 0 0 0 1.5px #8a96a3}
.row .r{text-align:right;font-size:12px;color:#4a5663}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.view img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph{aspect-ratio:16/9;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);
  background-image:repeating-linear-gradient(135deg,transparent 0 14px,var(--line) 14px 15px)}
.spend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.spend b{font-family:var(--mono);font-weight:500;font-size:20px}
.lim{display:block;height:10px;border-radius:5px;background:#e6ebf0;overflow:hidden}
.lim span{display:block;height:10px;border-radius:5px;background:var(--accent)}
.note{font-size:12px;color:#b45309}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.spend{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) 60px 70px}.row .c{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between">
    <div><h1 id="title">CAPEX Calculator</h1><p class="sub">Set the production plan. Modules, spend per year and the plant view follow. Changes here are a what-if; the budget file stays the source.</p></div>
    <button class="btn" id="reset" type="button">Restore values from the file</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <section class="panel basis" aria-label="Plant basis">
    <div style="flex:1 1 320px">
      <h2>Plant basis</h2>
      <label for="target" style="display:flex;justify-content:space-between;font-weight:500"><span>Target capacity</span><span class="mono" id="targetTxt"></span></label>
      <input id="target" type="range" step="250">
      <span class="small muted">Site, buildings and utilities are designed for this capacity.</span>
      <span style="font-weight:500;margin-top:6px">Production, % of target</span>
      <div class="ramp" id="ramp"></div>
    </div>
    <div style="flex:1 1 240px"><span style="font-weight:500">Product mix at target</span><div id="mix" style="display:flex;flex-direction:column;gap:8px"></div></div>
    <div style="flex:1.2 1 320px"><span style="font-weight:500" id="modsTitle"></span><div id="mods" style="display:flex;flex-direction:column;gap:9px"></div></div>
  </section>
  <section class="panel" aria-label="Timeline" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline">
      <h2 id="tlTitle">Timeline</h2>
      <span class="small muted" id="tlNote"></span>
    </div>
    <div class="years" id="years"></div>
  </section>
  <div class="main">
    <section class="left" aria-label="Objects">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2>Objects</h2><span class="small muted" id="objNote"></span></div>
      <div id="objects" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>
    <section class="right" aria-label="Plant view">
      <div class="panel view" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
          <strong style="font-family:var(--display);font-size:26px;font-weight:600" id="viewTitle"></strong><span class="small muted" id="renderName"></span>
        </div>
        <div id="viewer"></div>
      </div>
      <div class="panel spend" id="spend"></div>
    </section>
  </div>
</div>
<script>
/*__DATA__*/
const C = DATA.cfg, H = C.horizon, P = C.period, YEARS = Array.from({ length: H }, (_, i) => C.start + i);
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const cur = { EUR: "€", USD: "$", JPY: "¥", GBP: "£" }[C.report] || "";
const M = v => (cur || C.report + " ") + (v / 1e6).toFixed(2) + "M";
const kt = t => (t / 1000).toFixed(1) + " kt";
let S;
function fresh() { return { sel: Math.min(H - 1, 2), all: false, target: DATA.target, ramp: DATA.ramp.slice(), off: {}, open: {} }; }
S = fresh();

function model() {
  const W = DATA.wh, R = DATA.rules;
  const prod = S.ramp.map(r => S.target * (r || 0));
  const pos = prod.map(p => p <= 0 ? 0 : Math.ceil(p * W.fgDays / 365 / W.fgTpp * W.peak) + Math.ceil(p * W.rmShare * W.rmDays / 365 / W.rmTpp * W.peak));
  const units = {}, first = {};
  for (const id in R) {
    const r = R[id];
    units[id] = prod.map((p, i) => {
      if (p <= 0 && r.driver !== "trigger") return 0;
      if (r.driver === "trigger") return pos[i] > W.posMain ? 1 : 0;
      const d = r.driver === "pos" ? pos[i] : p;
      return Math.min(r.max, Math.max(r.min, Math.ceil(d / r.cap)));
    });
    const k = units[id].findIndex(u => u > 0); first[id] = k < 0 ? null : k;
  }
  const cap = prod.map((p, i) => {
    const c = Object.keys(R).filter(id => R[id].driver === "prod" && units[id][i] > 0).map(id => units[id][i] * R[id].cap);
    return c.length ? Math.min(...c) : 0;
  });
  const spend = new Array(H).fill(0);
  const L = DATA.lines.map(l => {
    const on = !S.off[l.pkg];
    const o = { l, on, spend: new Array(H).fill(0), inst: new Array(H).fill(0), start: null };
    if (l.type === "Per unit") {
      let tot = 0;
      for (let i = 0; i < H; i++) {
        const add = l.rule ? Math.max(0, units[l.rule][i] - (i ? units[l.rule][i - 1] : 0)) : (l.manual[i] || 0);
        tot += add; o.inst[i] = tot; o.spend[i] = on ? add * l.price : 0;
      }
    } else {
      o.start = l.rule ? (first[l.rule] === null ? null : C.start + first[l.rule]) : l.start;
      for (let i = 0; i < H; i++) {
        const y = C.start + i;
        if (on && o.start !== null && y >= o.start && y < o.start + l.dur) o.spend[i] = l.qty * l.price / l.dur;
      }
    }
    o.spend.forEach((v, i) => spend[i] += v);
    return o;
  });
  const sp = spend.map(v => v * C.factor);
  let c = 0; const cum = sp.map(v => c += v);
  return { prod, pos, units, first, cap, L, sp, cum, within: cum[Math.min(P, H) - 1], after: cum[H - 1] - cum[Math.min(P, H) - 1] };
}

function lineState(o, i) {
  const l = o.l, y = C.start + i;
  if (!o.on) return { st: "none", built: 0, qty: l.type === "Per unit" ? "0 / " + nf.format(l.max || l.qty) : fmtQty(l), when: "excluded" };
  if (l.type === "Per unit") {
    const n = o.inst[i], mx = l.max || l.qty;
    const ys = o.spend.map((v, k) => v > 0 ? "'" + String(C.start + k).slice(2) : null).filter(Boolean);
    return { st: n >= mx ? "done" : n > 0 ? "part" : "none", built: o.spend.slice(0, i + 1).reduce((a, b) => a + b, 0) * C.factor, qty: nf.format(n) + " / " + nf.format(mx), when: ys.join(", ") || "–" };
  }
  if (o.start === null) return { st: "none", built: 0, qty: fmtQty(l), when: l.rule ? "not needed" : "not planned" };
  const share = y < o.start ? 0 : Math.min(1, (y - o.start + 1) / l.dur);
  return { st: share >= 1 ? "done" : share > 0 ? "part" : "none", built: l.qty * l.price * share * C.factor, qty: fmtQty(l), when: l.dur > 1 ? o.start + "–" + String(o.start + l.dur - 1).slice(2) : String(o.start) };
}
function fmtQty(l) { return (l.qty === 1 && /^(set|ls)$/.test(l.unit)) ? "1 " + l.unit : nf.format(l.qty) + " " + l.unit; }

function renderStage(m, i) {
  const st = DATA.renders;
  let next = -1, miss = [];
  for (let k = 0; k < st.length; k++) {
    const need = [];
    m.L.forEach(o => {
      if (o.l.type === "Per unit" && o.l.steps.length) o.l.steps.forEach(([n, r]) => { if (r === st[k]) need.push(o.on && o.inst[i] >= n); });
      else if (o.l.render === st[k]) need.push(lineState(o, i).st === "done");
    });
    if (need.some(x => !x)) { next = k; break; }
  }
  return next >= 0 ? next - 1 : st.length - 1;
}

function build() {
  $("title").textContent = "CAPEX Calculator, " + C.project;
  const vals = DATA.ramp.map(r => r || 0);
  const t = $("target"); t.min = Math.round(DATA.target * 0.5); t.max = Math.round(DATA.target * 1.5); t.value = S.target;
  $("ramp").innerHTML = YEARS.map((y, i) => '<label for="r' + i + '">' + y + '<input type="number" id="r' + i + '" data-r="' + i + '" min="0" max="150" step="5" value="' + Math.round(S.ramp[i] * 100) + '"></label>').join("");
  $("tlTitle").textContent = "Timeline " + YEARS[0] + " – " + YEARS[H - 1];
  $("tlNote").textContent = "Production · spend incl. ×" + C.factor + " · darker = budget period " + C.start + "–" + (C.start + P - 1);
}

function update() {
  const m = model(), all = S.all, i = all ? H - 1 : S.sel, y = C.start + i, LIM = C.limit;
  const over = m.within > LIM, short = m.prod[i] > m.cap[i];
  $("targetTxt").textContent = nf.format(S.target) + " t/yr";
  $("kpis").innerHTML =
    '<div class="kpi"><span class="small muted">Budget period ' + C.start + '–' + (C.start + P - 1) + ', incl. ×' + C.factor + '</span><b>' + M(m.within) + '</b><span class="small muted">of ' + M(LIM) + ' limit</span></div>' +
    '<div class="kpi"><span class="small muted">' + (over ? "Over the limit by" : "Headroom in the budget period") + '</span><b style="color:' + (over ? "var(--bad)" : "var(--good)") + '">' + M(Math.abs(LIM - m.within)) + '</b><span class="small muted">after ' + (C.start + P - 1) + '</span></div>' +
    '<div class="kpi"><span class="small muted">Growth CAPEX ' + (C.start + P) + '–' + YEARS[H - 1] + ', incl. ×' + C.factor + '</span><b>' + M(m.after) + '</b><span class="small muted">outside the current budget</span></div>' +
    '<div class="kpi"><span class="small muted">Production / capacity in ' + y + '</span><b style="color:' + (short ? "var(--bad)" : "var(--ink)") + '">' + (m.prod[i] > 0 ? kt(m.prod[i]) + " / " + kt(m.cap[i]) : "no production") + '</b><span class="small muted">' + (short ? "Capacity short: modules at maximum" : m.prod[i] > 0 ? "Utilisation " + Math.round(m.prod[i] / m.cap[i] * 100) + "%" : "Construction") + '</span></div>';
  const mx = Math.max(...DATA.mix.map(g => g[1]), 0.0001);
  $("mix").innerHTML = DATA.mix.map(g => '<div class="meter"><span>' + esc(g[0]) + '</span><span class="mono small">' + nf.format(S.target * g[1]) + ' t</span><span class="track"><span style="width:' + (g[1] / mx * 100).toFixed(0) + '%"></span></span></div>').join("");
  $("modsTitle").textContent = "Modules needed at the end of " + y;
  const R = DATA.rules;
  $("mods").innerHTML = Object.keys(R).map(id => {
    const r = R[id], u = m.units[id][i];
    if (r.driver === "trigger") return '<div class="meter"><span>' + esc(r.name.replace(/ \(trigger\)/, "")) + '</span><span class="mono">' + (m.first[id] === null ? "not needed" : "from " + (C.start + m.first[id])) + '</span><span class="small muted" style="grid-column:1/3">Needed when pallet positions exceed ' + nf.format(DATA.wh.posMain) + '</span></div>';
    const atMax = u >= r.max && (r.driver === "prod" ? m.prod[i] > u * r.cap : m.pos[i] > u * r.cap);
    return '<div class="meter"><span>' + esc(r.name) + '</span><span class="mono" style="font-weight:500">' + u + ' / ' + r.max + '</span><span class="track"><span style="width:' + (r.max ? u / r.max * 100 : 0).toFixed(0) + '%;background:' + (atMax ? "var(--bad)" : "var(--accent)") + '"></span></span><span class="small muted" style="grid-column:1/3">' + nf.format(r.cap) + (r.driver === "pos" ? " pallet positions" : " t/yr") + ' per unit, min ' + r.min + (atMax ? " · at maximum" : "") + '</span></div>';
  }).join("") + '<div class="meter"><span>Pallet positions</span><span class="mono">' + nf.format(m.pos[i]) + ' / ' + nf.format(DATA.wh.posMain) + '</span><span class="track"><span style="width:' + Math.min(100, m.pos[i] / DATA.wh.posMain * 100).toFixed(0) + '%;background:' + (m.pos[i] > DATA.wh.posMain ? "#d98b1c" : "var(--accent)") + '"></span></span></div>';
  const mxs = Math.max(...m.sp, 1);
  $("years").innerHTML = YEARS.map((yy, k) => {
    const per = k < P, cls = ["yr", per ? "per" : "", (all || k < S.sel) ? "past" : "", (!all && k === S.sel) ? "on" : "", m.prod[k] > m.cap[k] ? "short" : ""].join(" ");
    return '<button type="button" class="' + cls + '" data-y="' + k + '" aria-pressed="' + (!all && k === S.sel) + '"><span class="y">' + yy + '</span><span class="small p">' +
      (m.prod[k] > 0 ? kt(m.prod[k]) + " · " + Math.round(S.ramp[k] * 100) + "%" : "construction") + '</span><span class="mono small">' + (m.sp[k] > 0 ? M(m.sp[k]) : "–") +
      '</span><span class="bar"><span style="width:' + (m.sp[k] / mxs * 100).toFixed(1) + '%"></span></span><span style="font-size:11px;opacity:.85">' + (per ? Math.round(m.cum[k] / LIM * 100) + "% of limit" : "after budget") + '</span></button>';
  }).join("") + '<button type="button" class="all' + (all ? " on" : "") + '" id="allbtn" aria-pressed="' + all + '">Whole plan</button>';
  $("objNote").textContent = "Built by the end of " + y + ", incl. ×" + C.factor;
  $("objects").innerHTML = DATA.packages.map((p, pi) => {
    const os = m.L.filter(o => o.l.pkg === p.name); if (!os.length) return "";
    const rows = os.map(o => Object.assign({ o }, lineState(o, i)));
    const built = rows.reduce((a, r) => a + r.built, 0), nd = rows.filter(r => r.st === "done").length, na = rows.filter(r => r.st !== "none").length;
    const off = !!S.off[p.name];
    const st = off ? ["p-off", "Excluded"] : nd === rows.length ? ["p-done", "Complete"] : na ? ["p-part", "Partly built"] : ["p-none", "Not yet"];
    const open = !!S.open[p.name];
    let sub = rows.length + " lines";
    const trig = os.find(o => o.l.rule && R[o.l.rule] && R[o.l.rule].driver === "trigger");
    if (trig) sub = trig.start ? "Triggered in " + trig.start + " when storage exceeds the main building" : "Not needed within the horizon";
    return '<div class="obj"><div class="objhead">' + (p.locked ? '<span style="width:18px"></span>' : '<input type="checkbox" data-pkg="' + pi + '" aria-label="Include ' + esc(p.name) + '"' + (off ? "" : " checked") + '>') +
      '<button type="button" class="objtog" data-open="' + pi + '" aria-expanded="' + open + '"><span class="chev" aria-hidden="true">' + (open ? "▼" : "▶") + '</span><span class="nm"><b>' + esc(p.name) + '</b><span class="small muted">' + esc(p.locked ? "Always included · " + sub : sub) +
      '</span></span><span class="rt"><span class="mono">' + M(built) + '</span><span class="pill ' + st[0] + '">' + st[1] + '</span></span></button></div>' +
      (open ? '<div class="rows">' + rows.map(r => '<div class="row"><span class="n"><span class="dot d-' + r.st + '" aria-hidden="true"></span><span>' + esc(r.o.l.desc) + '</span></span><span class="r mono">' + esc(r.qty) + '</span><span class="r">' + esc(r.when) + '</span><span class="r mono c">' + (r.built > 0 ? M(r.built) : "–") + '</span></div>').join("") +
      '<div class="legend"><span><span class="dot d-done"></span>Complete</span><span><span class="dot d-part"></span>In progress or partly installed</span><span><span class="dot d-none"></span>Not yet</span></div></div>' : "") + '</div>';
  }).join("");
  const k = renderStage(m, i), rn = k >= 0 ? DATA.renders[k] : null;
  $("viewTitle").textContent = all ? "Plant at the end of the plan (" + y + ")" : "Plant at the end of " + y;
  $("renderName").textContent = rn ? "Closest render: " + rn : "";
  $("viewer").innerHTML = rn && DATA.images[rn] ? '<img src="' + DATA.images[rn] + '" alt="Render: ' + esc(rn) + '">' : '<div class="ph">' + (rn ? esc(rn) + ": render file not found in the renders folder" : "No render for this stage yet") + '</div>';
  const inPer = i < P && !all, cumNow = inPer ? m.cum[i] : m.within, bad = cumNow > LIM;
  $("spend").innerHTML = '<div style="display:flex;flex-direction:column;gap:2px"><span class="small muted">' + (all ? "Whole plan incl. ×" + C.factor : "Spend in " + y + " incl. ×" + C.factor) + '</span><b>' + M(all ? m.cum[H - 1] : m.sp[i]) + '</b></div>' +
    '<div style="display:flex;flex-direction:column;gap:2px"><span class="small muted">Cumulative incl. ×' + C.factor + '</span><b>' + M(m.cum[i]) + '</b></div>' +
    '<div style="display:flex;flex-direction:column;gap:6px"><span class="small" style="font-weight:500;color:' + (bad ? "var(--bad)" : "var(--good)") + '">' + (inPer ? (bad ? "Over the limit by " + M(cumNow - LIM) : "Headroom " + M(LIM - cumNow)) : (bad ? "Budget period over by " + M(cumNow - LIM) : "Budget period closed with " + M(LIM - cumNow) + " left")) +
    '</span><span class="lim"><span style="width:' + Math.min(100, cumNow / LIM * 100).toFixed(1) + '%;background:' + (bad ? "var(--bad)" : "var(--accent)") + '"></span></span><span class="small muted">Budget period spend vs ' + M(LIM) + ' limit</span></div>';
}

document.addEventListener("click", e => {
  const yb = e.target.closest("[data-y]"); if (yb) { S.sel = +yb.dataset.y; S.all = false; return update(); }
  if (e.target.closest("#allbtn")) { S.all = true; return update(); }
  const ob = e.target.closest("[data-open]"); if (ob) { const n = DATA.packages[+ob.dataset.open].name; S.open[n] = !S.open[n]; return update(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pkg) { const n = DATA.packages[+t.dataset.pkg].name; S.off[n] = !t.checked; update(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "target") { S.target = +t.value; update(); }
  else if (t.dataset.r) { const v = parseFloat(t.value); S.ramp[+t.dataset.r] = isFinite(v) ? Math.max(0, v) / 100 : 0; update(); }
});
$("reset").addEventListener("click", () => { S = fresh(); build(); update(); });
DATA.packages.forEach(p => { if (p.name === "Production & Warehouse") S.open[p.name] = true; });
build(); update();
</script>
</body>
</html>
